<!DOCTYPE html>
<html lang="en" data-theme="synthwave">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VORTEX GAMING — Offline</title>
  <link rel="stylesheet" href="css/vortex.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="fx-scanlines" aria-hidden="true"></div>
  <div class="fx-vignette" aria-hidden="true"></div>
  <main style="position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
    <div>
      <p class="hero-kicker"><span class="pulse-dot"></span>SIGNAL LOST</p>
      <h1 class="hero-title" style="font-size:clamp(2.4rem,8vw,5rem)">OFFLINE</h1>
      <p style="color:var(--text-dim);font-weight:600;max-width:460px;margin:18px auto 30px">
        The grid is unreachable right now. Your arcade shell and all 16 games are cached —
        launch a title and it'll keep playing offline, then sync scores when the signal returns.
      </p>
      <a class="btn btn-neon btn-lg" href="index.html">RE-ENTER ARCADE</a>
    </div>
  </main>
  <div id="hud"></div>
</body>
</html>
